[project]
name = "eqvae-histo"
version = "0.1.0"
description = "Implementation of Equivariant-VAE"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "HiperMaximus", email = "hipermaximus@gmail.com" }]
license = { text = "Apache License 2.0"}
dependencies = [
    "numpy>=2.4.6",
    "torch>=2.12.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eqvae"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
    "scikit-image>=0.26.0",
]

[tool.ruff]
extend-exclude = [
    # Immutable Spec 0011 evidence; linting must not rewrite its recorded hash.
    "docs/data/spec0011_runtime_recipe_v2/producer/run.py",
]
target-version = "py312"

[tool.ruff.lint]
# Research code: catch syntax, invalid control flow and undefined names only.
select = ["E9", "F6", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
exclude = [
    ".venv",
    "build",
    "dist",
    "kaggle",
    "paper",
]
include = [
    "experiments",
    "src/eqvae",
    "tests",
]
pythonPlatform = "Linux"
pythonVersion = "3.12"
# PyTorch tensor shapes and experiment payloads are runtime-checked where needed;
# static analysis should catch ordinary mistakes, not require exhaustive typing.
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."
