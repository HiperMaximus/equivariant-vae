[project]
name = "eqvae-histo"
version = "0.1.0"
description = "Implementation of Equivariant-VAE"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "HiperMaximus", email = "hipermaximus@gmail.com" }]
license = { text = "Apache License 2.0"}
dependencies = [
    "numpy>=2.4.6",
    "torch>=2.12.0",
]

# Pinned: build requirements are NOT recorded in uv.lock, so an unpinned backend would
# leave `uv sync --locked` resolving hatchling fresh from the index -- a hole in the
# reproducibility that --locked otherwise promises (AGENTS.md rule 25).
[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

# Spec 0001's package/import policy: `PYTHONPATH=src` was the interim contract "until a
# packaging backend is explicitly added". This is that backend. Without a [build-system],
# uv treats the project as VIRTUAL (uv.lock said `source = { virtual = "." }`): it installs
# dependencies but never the project, so `eqvae` was absent from the venv and every entry
# point needed PYTHONPATH=src.
#
# The editable install emits a naive .pth containing `<repo>/src`, putting that whole
# directory on sys.path -- so anything living beside eqvae under src/ would be importable
# locally but ABSENT from the Kaggle payload, which ships only src/eqvae. `src/` is
# therefore kept single-child (reference code lives in reference/, see spec 0002), which
# makes that divergence structurally impossible rather than merely guarded. Enforced by
# test_src_contains_only_the_shipped_eqvae_package.
#
# Do NOT try to solve it with `dev-mode-exact = true` instead: that swaps the .pth for a
# finder importing `editables` at RUNTIME, which is a build-time dep absent from the venv,
# so `import eqvae` dies with ModuleNotFoundError: No module named 'editables' (verified
# 2026-07-15).
[tool.hatch.build.targets.wheel]
packages = ["src/eqvae"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
    "scikit-image>=0.26.0",
]

[tool.ruff]
extend-exclude = ["reference", "kaggle/fsq_train_reference.py"]
fix = false
line-length = 88
preview = true
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
fixable = ["ALL"]
ignore = []
select = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.basedpyright]
exclude = [
    ".venv",
    "build",
    "dist",
    "kaggle",
    "paper",
    "reference",
]
include = [
    "src/eqvae",
    "tests",
]
pythonPlatform = "Linux"
pythonVersion = "3.12"
reportAny = "error"
reportIgnoreCommentWithoutRule = "error"
reportMissingImports = "error"
reportMissingTypeStubs = "error"
strict = [
    "src/eqvae",
    "tests",
]
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
