[project]
name = "eqvae-histo"
version = "0.1.0"
description = "Implementation of Equivariant-VAE"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "HiperMaximus", email = "hipermaximus@gmail.com" }]
license = { text = "Apache License 2.0"}
dependencies = [
    "numpy>=2.4.6",
    "torch>=2.12.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eqvae"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
    "scikit-image>=0.26.0",
]

[tool.ruff]
extend-exclude = [
    # Hash-pinned historical evidence; linting must never rewrite these bytes.
    "docs/data/spec0011_runtime_recipe_v2/producer/run.py",
    # Generated hash-bearing upload artifact; validate it with its kernel builder.
    "kaggle/kernels/vae_test_reconstruction/run.py",
]
fix = false
line-length = 88
preview = true
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
    # noqa-comments (RUF105) nags to rewrite every `# noqa` into ruff-native
    # `# ruff:ignore[...]`. Cosmetic-only (no correctness/quality gain) and its
    # autofix mangles existing suppressions, so `import-outside-top-level`/
    # `import-private-name` spuriously fire. Deliberately excluded; the
    # `# noqa`/`# ruff:ignore` mix stays as-is.
    "noqa-comments",
]
select = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["assert"]
# Kaggle wrappers use flushed JSONL progress events as their sole remote
# observability channel. Keep T201 enabled for local/product code.
"kaggle/kernels/**/*.py" = ["print"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
exclude = [
    ".venv",
    "build",
    "dist",
    "kaggle",
    "paper",
]
include = [
    "src/eqvae",
    "tests",
]
pythonPlatform = "Linux"
pythonVersion = "3.12"
reportAny = "error"
reportIgnoreCommentWithoutRule = "error"
reportMissingImports = "error"
reportMissingTypeStubs = "error"
strict = [
    "src/eqvae",
    "tests",
]
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
